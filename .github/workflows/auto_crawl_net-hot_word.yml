# 自动更新搜狗 scel 词库到 rime 词库
# main 分支：小鹤双拼编码；full_pinyin 分支：无声调全拼编码（同一份热词数据，每天同时构建）
name: auto_crawl_net_hot_word

on:
  schedule:
    - cron: "30 1 * * *" # 设置定时任务
  workflow_dispatch:

# 权限配置
permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  auto_crawl_net_hot_word:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests pypinyin pypinyin_dict python-dateutil openai akshare

      - name: Run douyin_hot.py to get latest Douyin hot keywords
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 ./tools/python/crawl_douyin_hot.py
          python3 ./tools/python/crawl_douyin_hot.py --encoding quanpin

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download imewlconverter_linux
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/studyzy/imewlconverter/releases/latest | jq -r .tag_name)
          wget "https://github.com/studyzy/imewlconverter/releases/download/${LATEST_TAG}/imewlconverter_linux-x64.tar.gz"
          tar -xvf imewlconverter_linux-x64.tar.gz

      - name: Download sogou scel file
        run: |
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts..."
            if curl -fsL -o sogou_net_pop.scel 'https://pinyin.sogou.com/d/dict/download_cell.php?id=4&name=网络流行新词【官方推荐】&f=detail'; then
              echo "Download successful!"
              exit 0
            else
              echo "Download failed!"
              if [ $attempt -lt $max_attempts ]; then
                echo "Waiting 3 seconds before retry..."
                sleep 3
              fi
              attempt=$((attempt + 1))
            fi
          done
          echo "All $max_attempts attempts failed!"
          exit 1

      - name: Convert sogou scel to rime quanpin dict
        run: |
          chmod +x ./ImeWlConverterCmd
          ./ImeWlConverterCmd -i scel -f "rm:eng|rm:num|rm:space|rm:pun" -r 100 -o rime -O sghot.dict.yaml sogou_net_pop.scel

      - name: Gen incremental update dict items
        run: |
          awk -F'\t' 'FNR==NR{a[$1]++;w[$1]=$0};FNR!=NR&&FNR>10{b[$1]++}END{for(i in a){if(b[i]<1)print w[i]}}' ./sghot.dict.yaml ./flypy_sghot.dict.yaml >diff_sg.txt

      - name: Seed quanpin dictionary from full_pinyin branch
        run: |
          # 全拼构建必须以分支上已有的全拼词库为基数，否则每次都从零开始只剩当日增量
          git fetch --depth 1 origin full_pinyin:refs/remotes/origin/full_pinyin || true
          if git show-ref --verify --quiet refs/remotes/origin/full_pinyin; then
            git show refs/remotes/origin/full_pinyin:flypy_sghot.dict.yaml > ./flypy_sghot_quanpin.dict.yaml
            echo "Seeded ./flypy_sghot_quanpin.dict.yaml from full_pinyin branch."
          else
            echo "full_pinyin branch not found, will build quanpin dict from scratch."
          fi

      - name: Run crawl_net_hot_dict.py to update dictionary
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 ./tools/python/crawl_net_hot_dict.py
          python3 ./tools/python/crawl_net_hot_dict.py --encoding quanpin

      - name: Verify flypy hot-word dict entries
        run: |
          # 校验规则：去空格后的双拼编码长度/2 应等于词条有效字数（剥离空格、·、— 等）；
          # $0 ~ /\t/ 用于跳过 YAML 表头行，避免无编码列的误报
          AWK_RULE='$0 ~ /\t/ && $0 !~ /^#/{'
          AWK_RULE+='if(length(gensub(" ","","g", $2))/2 != length(gensub(/[ ·-—]/, "", "g", $1)))'
          AWK_RULE+='print $0}'
          INVALID=$(awk -F'\t' "$AWK_RULE" ./flypy_sghot.dict.yaml)
          if [ -n "$INVALID" ]; then
            echo "Found invalid hot-word entries:"
            echo "$INVALID"
            exit 1
          fi
          echo "All flypy hot-word entries passed the length check."

      - name: Run fetch_a_stock.py to update A-share dictionary
        run: |
          python3 ./tools/python/fetch_a_stock.py

      - name: Remove intermediate file
        run: |
          rm -f ./sghot.dict.yaml ./flypy_dyhot.dict.yaml ./flypy_dyhot_quanpin.dict.yaml ./diff_sg.txt

      - name: Set env
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes (main, 双拼)
        run: |
          git add ./flypy_sghot.dict.yaml ./flypy_stock.dict.yaml
          if git diff --staged --quiet; then
            echo "No generated dictionary changes to commit."
          else
            git commit -m "Refresh generated dictionaries for scheduled updates" \
              -m "Constraint: daily workflow updates both hot-word and A-share dictionary artifacts." \
              -m "Confidence: high" \
              -m "Scope-risk: narrow" \
              -m "Directive: keep generated dictionary files in sync with the scheduled scripts." \
              -m "Tested: scheduled job ran generation steps before commit" \
              -m "Not-tested: push permissions and remote availability"
          fi
          git push origin main

      - name: Update full_pinyin branch (全拼)
        run: |
          if [ ! -f ./flypy_sghot_quanpin.dict.yaml ]; then
            echo "No quanpin dictionary generated, skip full_pinyin branch update."
            exit 0
          fi
          git fetch --depth 1 origin full_pinyin:refs/remotes/origin/full_pinyin || true
          if git show-ref --verify --quiet refs/remotes/origin/full_pinyin; then
            git checkout -B full_pinyin refs/remotes/origin/full_pinyin
          else
            # 首次运行：以孤儿分支创建 full_pinyin，分支上只保留全拼热词词库
            git checkout --orphan full_pinyin
            git rm -rf --quiet .
          fi
          cp ./flypy_sghot_quanpin.dict.yaml ./flypy_sghot.dict.yaml
          git add ./flypy_sghot.dict.yaml
          if git diff --staged --quiet; then
            echo "No generated quanpin dictionary changes to commit."
          else
            git commit -m "Refresh quanpin hot-word dictionary for scheduled updates" \
              -m "Constraint: daily workflow publishes the toneless quanpin hot-word build." \
              -m "Confidence: high" \
              -m "Scope-risk: narrow" \
              -m "Directive: main keeps flypy codes only; full_pinyin keeps quanpin codes only." \
              -m "Tested: scheduled job ran quanpin generation steps before commit" \
              -m "Not-tested: push permissions and remote availability"
          fi
          git push origin full_pinyin
