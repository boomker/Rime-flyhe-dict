# 自动更新搜狗 scel 词库到 rime 词库
name: auto_crawl_net_hot_word

on:
  schedule:
    - cron: "30 1 * * *" # 设置定时任务
  workflow_dispatch:

# 权限配置
permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  auto_crawl_net_hot_word:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.1.1
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests pypinyin pypinyin_dict python-dateutil openai

      - name: Run douyin_hot.py to get latest Douyin hot keywords
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 ./tools/python/crawl_douyin_hot.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download imewlconverter_linux
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/studyzy/imewlconverter/releases/latest | jq -r .tag_name)
          wget "https://github.com/studyzy/imewlconverter/releases/download/${LATEST_TAG}/imewlconverter_linux-x64.tar.gz"
          tar -xvf imewlconverter_linux-x64.tar.gz

      - name: Download sogou scel file
        run: |
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts..."
            if curl -fsL -o sogou_net_pop.scel 'https://pinyin.sogou.com/d/dict/download_cell.php?id=4&name=网络流行新词【官方推荐】&f=detail'; then
              echo "Download successful!"
              exit 0
            else
              echo "Download failed!"
              if [ $attempt -lt $max_attempts ]; then
                echo "Waiting 3 seconds before retry..."
                sleep 3
              fi
              attempt=$((attempt + 1))
            fi
          done
          echo "All $max_attempts attempts failed!"
          exit 1

      - name: Convert sogou scel to rime quanpin dict
        run: |
          chmod +x ./publish/linux-x64/ImeWlConverterCmd
          ./publish/linux-x64/ImeWlConverterCmd -i:scel sogou_net_pop.scel -ft:"rm:eng|rm:num|rm:space|rm:pun" -r:100 -o:rime sghot.dict.yaml

      - name: Gen incremental update dict items
        run: |
          awk -F'\t' 'FNR==NR{a[$1]++;w[$1]=$0};FNR!=NR&&FNR>10{b[$1]++}END{for(i in a){if(b[i]<1)print w[i]}}' ./sghot.dict.yaml ./flypy_sghot.dict.yaml >diff_sg.txt

      - name: Run crawl_net_hot_dict.py to update dictionary
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 ./tools/python/crawl_net_hot_dict.py

      - name: Remove intermediate file
        run: |
          rm -f ./sghot.dict.yaml ./flypy_dyhot.dict.yaml

      - name: Set env
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add ./flypy_sghot.dict.yaml
          git commit -m "Update hot dict"
          git push origin main
